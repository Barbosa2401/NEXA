<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>NEXA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Biblioteca para gerar Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header>
    <h1>NEXA FIELD SYSTEM</h1>
    <div style="margin-top: 15px;">
        <input type="file" id="csvFile" accept=".csv">
        <button class="btn-export" id="exportBtn" style="display: none;">Exportar para Excel</button>
    </div>
</header>

<div class="container" id="dashboard"></div>

<script>
    let currentData = [];

    // 1. Escuta a seleção do arquivo CSV
    document.getElementById('csvFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        
        Papa.parse(file, {
            header: true,
            delimiter: ";",
            skipEmptyLines: true,
            complete: function(results) {
                currentData = results.data;
                // Mostra o botão de exportar apenas se houver dados
                if(currentData.length > 0) {
                    document.getElementById('exportBtn').style.display = 'inline-block';
                }
                renderCards(results.data);
            }
        });
    });

    // 2. Renderiza os Cards com Glassmorphism e Correção de Discos
    function renderCards(data) {
        const container = document.getElementById('dashboard');
        container.innerHTML = ""; 

        data.forEach(maquina => {
            // Pula linhas que não possuem Hostname (evita cards vazios no fim do arquivo)
            if(!maquina.Hostname || maquina.Hostname.trim() === "") return;

            // --- LÓGICA DE LIMPEZA DOS DISCOS ---
            let discosRaw = maquina.Discos_Detectados || "";

            // Se o Hostname vazou para o campo de discos, nós o removemos aqui
            if (discosRaw.includes(maquina.Hostname)) {
                discosRaw = discosRaw.split(maquina.Hostname)[0].trim();
            }

            // Separa os discos por parênteses fechado seguido de espaço ou ponto e vírgula
            const discosArray = discosRaw.split(/\)\s*|;/).filter(d => d.trim() !== "");

            const listaDiscosHtml = discosArray.map(d => {
                let textoDisco = d.trim();
                if (textoDisco === "") return "";
                // Garante que o parênteses de fechamento exista para não quebrar o layout
                if (!textoDisco.endsWith(')')) textoDisco += ')';
                return `<span class="disk-item">• ${textoDisco}</span>`;
            }).join('');

            // --- LÓGICA DE ALERTAS (RAM) ---
            const ramValue = parseInt(maquina.Memoria_RAM) || 0;
            let alertClass = "";
            let statusText = "Verificado";
            let statusClass = "status-badge";

            // Regras baseadas na sua necessidade de Analista Field
            if (ramValue > 0 && ramValue < 8) {
                alertClass = "danger";
                statusText = "Upgrade Necessário";
                statusClass += " badge-danger";
            } else if (ramValue === 8) {
                alertClass = "warning";
                statusText = "Atenção (RAM)";
                statusClass += " badge-warning";
            }

            // --- MONTAGEM DO CARD ---
            const card = document.createElement('div');
            card.className = `card ${alertClass}`;
            
            card.innerHTML = `
                <div class="card-header">
                    <span>${maquina.Hostname}</span>
                    <span class="${statusClass}">${statusText}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Equipamento</span>
                    ${maquina.Fabricante_Modelo || 'N/A'}
                </div>
                <div class="info-item">
                    <span class="info-label">Processador</span>
                    ${maquina.Processador || 'N/A'}
                </div>
                <div class="info-item">
                    <span class="info-label">Memória RAM</span>
                    <span class="${ramValue <= 8 ? 'low-value' : ''}">${maquina.Memoria_RAM || 'N/A'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Armazenamento</span>
                    <div class="disk-list">${listaDiscosHtml || 'Nenhum disco detectado'}</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // 3. Função de Exportação para Excel (.xlsx)
    document.getElementById('exportBtn').addEventListener('click', function() {
        if(currentData.length === 0) return;

        // Converte o JSON do PapaParse para uma planilha oficial
        const ws = XLSX.utils.json_to_sheet(currentData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Inventario_Hardware");
        
        // Gera o download do arquivo
        XLSX.writeFile(wb, "Relatorio_NEXA_Field.xlsx");
    });
</script>
</body>
</html>
